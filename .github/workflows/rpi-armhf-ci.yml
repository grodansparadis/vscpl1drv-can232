name: Raspberry Pi armhf CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-rpi-armhf:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install armhf cross toolchain and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf rpm

      - name: Configure CMake (cross-compile armhf)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armhf \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Generate CPack packages (DEB, TGZ)
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G TGZ

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/*.deb artifacts/ 2>/dev/null || true
          cp build/*.tar.gz artifacts/ 2>/dev/null || true
          cp build/*.sha256 artifacts/ 2>/dev/null || true
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-rpi-armhf-packages
          path: artifacts/
          retention-days: 30
