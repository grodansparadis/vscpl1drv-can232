name: Codacy Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  codacy-analysis:
    name: Codacy Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Optional: set CODACY_PROJECT_TOKEN in repo secrets to sync results with Codacy
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Make SARIF output compatible with GitHub code scanning
          gh-code-scanning-compat: true
          # Report all issues without failing the step; upload handles visibility
          max-allowed-issues: 2147483647

      - name: Prepare SARIF chunks for GitHub code scanning
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import tempfile

          sarif_path = "results.sarif"
          output_dir = "results-sarif"
          max_runs_per_file = 20

          with open(sarif_path, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          runs = sarif.get("runs", [])
          for run_index, run in enumerate(runs):
              automation_details = run.get("automationDetails", {})
              automation_details["id"] = f"codacy-analysis-run-{run_index}"
              run["automationDetails"] = automation_details

          shutil.rmtree(output_dir, ignore_errors=True)
          os.mkdir(output_dir)

          chunk_starts = range(0, len(runs), max_runs_per_file) if runs else (0,)
          for file_index, start in enumerate(chunk_starts, start=1):
              chunk = dict(sarif)
              chunk["runs"] = runs[start:start + max_runs_per_file]

              final_path = os.path.join(output_dir, f"results-{file_index}.sarif")
              temp_path = None
              try:
                  with tempfile.NamedTemporaryFile(
                      dir=output_dir,
                      suffix=".sarif",
                      mode="w",
                      encoding="utf-8",
                      delete=False,
                  ) as f:
                      temp_path = f.name
                      json.dump(chunk, f)
                  os.replace(temp_path, final_path)
              finally:
                  if temp_path and os.path.exists(temp_path):
                      os.remove(temp_path)
          PY

      - name: Upload SARIF results to GitHub code scanning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          commit_sha = os.environ["GITHUB_SHA"]
          ref = os.environ["GITHUB_REF"]
          checkout_uri = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().as_uri()

          sarif_files = sorted(pathlib.Path("results-sarif").glob("*.sarif"))
          if not sarif_files:
              raise SystemExit("No SARIF files found in results-sarif")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "User-Agent": "codacy-sarif-uploader",
          }

          def request_json(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(body, file=sys.stderr)
                  raise

          def wait_for_processing(sarif_id):
              status_url = f"{api_url}/repos/{repository}/code-scanning/sarifs/{sarif_id}"
              while True:
                  response = request_json("GET", status_url)
                  status = response.get("processing_status")
                  if status == "pending":
                      time.sleep(5)
                      continue
                  return response

          for sarif_file in sarif_files:
              compressed = gzip.compress(sarif_file.read_bytes())
              payload = {
                  "commit_sha": commit_sha,
                  "ref": ref,
                  "checkout_uri": checkout_uri,
                  "sarif": base64.b64encode(compressed).decode("ascii"),
              }
              response = request_json(
                  "POST",
                  f"{api_url}/repos/{repository}/code-scanning/sarifs",
                  payload,
              )
              sarif_id = response["id"]
              response = wait_for_processing(sarif_id)
              if response.get("processing_status") != "complete":
                  errors = response.get("errors", [])
                  print(
                      f"Code scanning rejected {sarif_file}: "
                      f"{json.dumps(errors, indent=2)}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
          PY
