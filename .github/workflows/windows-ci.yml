name: Windows CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify NSIS toolchain
        shell: pwsh
        run: |
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $mk) {
            Write-Error "makensis.exe not found on PATH after NSIS installation."
            exit 1
          }
          Write-Host "makensis path: $($mk.Source)"
          & $mk.Source /VERSION

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Install
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Generate CPack packages (NSIS, ZIP)
        shell: pwsh
        working-directory: build
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          Write-Host "Running CPack NSIS..."
          cpack -G NSIS -C Release -B $pkgDir --verbose --debug
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CPack NSIS generation failed with exit code $LASTEXITCODE"
            Get-ChildItem -Path . -File -Filter "CPack*.cmake" | ForEach-Object { Write-Host "Config file: $($_.FullName)" }
            $nsisLogs = Get-ChildItem -Path $pkgDir -Recurse -File -Filter "NSISOutput.log" -ErrorAction SilentlyContinue
            if ($nsisLogs) {
              $nsisLogs | ForEach-Object {
                Write-Host "NSIS log: $($_.FullName)"
                Write-Host "--- NSISOutput.log (tail 200 lines) ---"
                Get-Content -Path $_.FullName -Tail 200 | ForEach-Object { Write-Host $_ }
                Write-Host "--- End NSISOutput.log ---"
              }
            } else {
              Write-Host "NSISOutput.log not found under $pkgDir"
            }
            exit $LASTEXITCODE
          }

          Write-Host "Running CPack ZIP..."
          cpack -G ZIP -C Release -B $pkgDir --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CPack ZIP generation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "CPack output files:"
          Get-ChildItem -Path $pkgDir -Recurse -File | ForEach-Object { Write-Host " - $($_.FullName)" }

      - name: Locate NSIS installer output
        shell: pwsh
        run: |
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          $nsis = Get-ChildItem -Path $pkgDir -File -Filter *.exe
          if (-not $nsis) {
            Write-Error "No NSIS installer (.exe) was generated by CPack."
            Write-Host "Listing package directory contents for debugging:"
            Get-ChildItem -Path $pkgDir -Recurse -File | ForEach-Object { Write-Host " - $($_.FullName)" }
            exit 1
          } else {
            $nsis | ForEach-Object { Write-Host "NSIS installer: $($_.FullName)" }
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          Get-ChildItem -Path $pkgDir -File | Where-Object {
            $_.Extension -in @('.exe', '.zip', '.sha256')
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts/ -Force
            Write-Host "Package: $($_.Name)"
          }

          # Digest files for any artifact CPack did not cover
          Get-ChildItem -Path artifacts -File | Where-Object {
            $_.Extension -ne '.sha256' -and -not (Test-Path "$($_.FullName).sha256")
          } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
            Write-Host "Digest: $($_.Name).sha256"
          }

          $artifactFiles = Get-ChildItem -Path artifacts -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $artifactFiles) {
            Write-Error "No package artifacts (.exe/.zip) were collected."
            exit 1
          }

          Write-Host "Final artifacts:"
          $artifactFiles | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-windows-packages
          path: artifacts/
          retention-days: 30
