name: Windows CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Install
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Generate CPack packages (NSIS, ZIP)
        shell: pwsh
        working-directory: build
        run: |
          cpack -G NSIS -C Release --verbose
          cpack -G ZIP -C Release

      - name: Locate NSIS installer output
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path build -Recurse -File -Filter *.exe |
            Where-Object {
              $_.FullName -match "_CPack_Packages[\\/].*[\\/]NSIS[\\/]" -or
              $_.Name -match "(?i)^vscpl1drv-can232.*\.exe$"
            }
          if (-not $nsis) {
            Write-Warning "No NSIS installer found in expected CPack paths."
            Write-Host "EXE files found under build/:"
            Get-ChildItem -Path build -Recurse -File -Filter *.exe | ForEach-Object {
              Write-Host " - $($_.FullName)"
            }
          } else {
            $nsis | ForEach-Object { Write-Host "NSIS installer: $($_.FullName)" }
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem -Path build -Recurse -File | Where-Object {
            $_.Extension -in @('.exe', '.zip') -and (
              $_.FullName -match "_CPack_Packages[\\/].*[\\/](NSIS|ZIP)[\\/]" -or
              $_.Name -match "(?i)^vscpl1drv-can232.*\.(exe|zip)$"
            )
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts/ -Force
          }
          Get-ChildItem artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-windows-packages
          path: artifacts/
          retention-days: 30
