name: Windows CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Install
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Generate CPack packages (NSIS, ZIP)
        shell: pwsh
        working-directory: build
        run: |
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          cpack -G NSIS -C Release -B $pkgDir --verbose
          cpack -G ZIP -C Release -B $pkgDir

      - name: Locate NSIS installer output
        shell: pwsh
        run: |
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          $nsis = Get-ChildItem -Path $pkgDir -File -Filter *.exe
          if (-not $nsis) {
            Write-Error "No NSIS installer (.exe) was generated by CPack."
            Write-Host "Listing package directory contents for debugging:"
            Get-ChildItem -Path $pkgDir -Recurse -File | ForEach-Object { Write-Host " - $($_.FullName)" }
            exit 1
          } else {
            $nsis | ForEach-Object { Write-Host "NSIS installer: $($_.FullName)" }
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $pkgDir = "${{ github.workspace }}/artifacts/packages"
          Get-ChildItem -Path $pkgDir -File | Where-Object {
            $_.Extension -in @('.exe', '.zip')
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts/ -Force
            Write-Host "Package: $($_.Name)"
          }

          $artifactFiles = Get-ChildItem -Path artifacts -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          if (-not $artifactFiles) {
            Write-Error "No package artifacts (.exe/.zip) were collected."
            exit 1
          }

          Write-Host "Final artifacts:"
          $artifactFiles | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-windows-packages
          path: artifacts/
          retention-days: 30
