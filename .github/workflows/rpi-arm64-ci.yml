name: Raspberry Pi arm64 CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-rpi-arm64:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install arm64 cross toolchain and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu rpm

      - name: Configure CMake (cross-compile arm64)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Generate CPack packages (DEB, TGZ)
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G TGZ

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/*.deb artifacts/ 2>/dev/null || true
          cp build/*.tar.gz artifacts/ 2>/dev/null || true
          cp build/*.sha256 artifacts/ 2>/dev/null || true
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-rpi-arm64-packages
          path: artifacts/
          retention-days: 30
