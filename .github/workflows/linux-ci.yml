name: Linux CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Generate CPack packages (DEB, RPM, TGZ)
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/*.deb artifacts/ 2>/dev/null || true
          cp build/*.rpm artifacts/ 2>/dev/null || true
          cp build/*.tar.gz artifacts/ 2>/dev/null || true
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl1drv-can232-linux-packages
          path: artifacts/
          retention-days: 30
